[ build-system ]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[ project ]
name = "PyBLNET"
version = "1.0.0"
description = "Automate wireless communication to UVR1611 via BL-NET"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "nielstron", email = "n.muendler@posteo.de"}
]
keywords = ["python", "uvr1611", "blnet", "technische alternative", "home automation", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Object Brokering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
dependencies = [
    "requests",
]

[project.optional-dependencies]
# the async clients in pyblnet.aio
async = [
    "aiohttp>=3.9",
]
test = [
    "pytest",
    "aiohttp>=3.9",
]

[ project.urls ]
"Homepage" = "https://github.com/PyBLNET/pyblnet/"

[ tool.flit.module ]
name = "pyblnet"